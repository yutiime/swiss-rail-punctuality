[project]
name = "swiss-rail-punctuality"
version = "0.1.0"
description = "Daily train punctuality in Switzerland from open delay data"
readme = "README.md"
authors = [
    { name = "yutiime", email = "y.demirel467@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "duckdb>=1.5.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
